<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tama Store - QRIS Dinamis</title>
<style>
*{box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{margin:0;background:#0a0a0a;color:#fff;display:flex;flex-direction:column;align-items:center;min-height:100vh}
.header{padding:22px 16px 8px;text-align:center}
.card{width:92%;max-width:380px;background:#fff;border-radius:20px;padding:12px;margin-top:10px}
.top{text-align:center;color:#111;font-weight:900}
.qr{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:12px}
#qrcanvas{width:300px;height:300px}
.badge{margin-top:8px;text-align:center;background:#111;color:#fff;font-size:11px;padding:6px 10px;border-radius:20px;width:fit-content;margin-inline:auto}
.amount{width:92%;max-width:380px;background:#151515;border:1px solid #222;border-radius:16px;padding:14px;margin:16px 0}
.sheet{position:fixed;bottom:0;left:0;right:0;background:#fff;color:#111;border-radius:24px 24px 0 0;padding:16px;max-width:420px;margin:0 auto}
.keypad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.key{height:54px;border:none;background:#f3f3f5;border-radius:12px;font-size:20px;font-weight:600}
.btn{width:100%;height:50px;border:none;border-radius:12px;background:#111;color:#fff;font-weight:700;margin-top:12px}
.btn:disabled{opacity:.3}
.btn.active{background:#e11d48}
.hidden{display:none}
</style>
</head>
<body>
<div class="header"><h1>MR.TAMA - Tama Store</h1><p>NMID ID1025408255863</p></div>
<div class="card"><div class="top">QRIS - TAMA STORE</div><div class="qr"><canvas id="qrcanvas" width="300" height="300"></canvas></div><div class="badge" id="badge">STATIS</div></div>
<div class="amount"><div style="font-size:11px;opacity:.5">JUMLAH BAYAR</div><div style="font-size:32px;font-weight:800">Rp<span id="amountText">0</span></div></div>
<div id="status" style="font-size:11px;opacity:.6;text-align:center">Upload QRIS asli</div>
<label for="fileInput" style="color:#ff3040;font-size:12px;text-decoration:underline;cursor:pointer">UPLOAD QRIS ASLI</label>
<input type="file" id="fileInput" accept="image/*" style="display:none">
<div class="sheet">
<div style="width:36px;height:4px;background:#ddd;border-radius:10px;margin:0 auto 12px"></div>
<h3 style="text-align:center;margin:0 0 12px">Atur Harga</h3>
<div style="border-bottom:1px solid #eee;padding-bottom:10px;margin-bottom:10px"><div style="font-size:12px;opacity:.5">Jumlah</div><div id="inputDisplay" style="font-size:26px;font-weight:700">Rp0</div></div>
<div class="keypad">
<button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
<button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
<button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
<button class="key" data-k="0">0</button><button class="key" data-k="000">000</button><button class="key" data-k="del">X</button>
</div>
<button class="btn" id="btnCreate" disabled>BUAT QRIS</button>
<button class="btn hidden" id="btnReset" style="background:#fff;color:#111;border:1px solid #ddd">RESET</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
let basePayload=null,currentAmount="";
const amountText=document.getElementById('amountText'),inputDisplay=document.getElementById('inputDisplay'),btnCreate=document.getElementById('btnCreate'),btnReset=document.getElementById('btnReset'),badge=document.getElementById('badge'),canvas=document.getElementById('qrcanvas'),statusEl=document.getElementById('status');
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++){if(c&0x8000)c=(c<<1)^0x1021;else c<<=1;c&=0xFFFF}}return c.toString(16).toUpperCase().padStart(4,'0')}
function makeDynamic(payload,amount){
let noCrc=payload.split("6304")[0];
if(noCrc.startsWith("000201010211"))noCrc="000201010212"+noCrc.substring(12);
else noCrc=noCrc.replace("010211","010212");
let cleaned="";let i=0;while(i+4<=noCrc.length){let tag=noCrc.substr(i,2);let len=parseInt(noCrc.substr(i+2,2),10);if(isNaN(len))break;let tot=4+len;if(tag==="54"){i+=tot;continue}cleaned+=noCrc.substr(i,tot);i+=tot}
let insert=cleaned.indexOf("5802");if(insert===-1)insert=cleaned.length;
let aStr=amount.toString();let aTag="54"+String(aStr.length).padStart(2,'0')+aStr;
let withA=cleaned.slice(0,insert)+aTag+cleaned.slice(insert);
let withCrc=withA+"6304";return withCrc+crc16(withCrc);
}
function renderQR(t){QRCode.toCanvas(canvas,t,{width:300,margin:1},e=>{})}
function updateDisplay(){let d=currentAmount?Number(currentAmount).toLocaleString('id-ID'):"0";amountText.textContent=d;inputDisplay.textContent="Rp"+d;btnCreate.disabled=!currentAmount||!basePayload;if(currentAmount&&basePayload)btnCreate.classList.add('active');else btnCreate.classList.remove('active')}
document.querySelectorAll('.key').forEach(k=>{k.addEventListener('click',()=>{let v=k.dataset.k;if(v==='del')currentAmount=currentAmount.slice(0,-1);else{if(currentAmount.length>=12)return;if(currentAmount===""&&(v==="0"||v==="000"))return;currentAmount+=v}updateDisplay()})});
btnCreate.addEventListener('click',()=>{let dyn=makeDynamic(basePayload,currentAmount);renderQR(dyn);badge.textContent="DINAMIS Rp"+Number(currentAmount).toLocaleString('id-ID');badge.style.background="#e11d48";btnReset.classList.remove('hidden');btnCreate.classList.add('hidden')});
btnReset.addEventListener('click',()=>{currentAmount="";updateDisplay();renderQR(basePayload);badge.textContent="STATIS";badge.style.background="#111";btnReset.classList.add('hidden');btnCreate.classList.remove('hidden')});
document.getElementById('fileInput').addEventListener('change',e=>{let file=e.target.files[0];if(!file)return;let img=new Image();img.onload=()=>{let c=document.createElement('canvas');c.width=img.width;c.height=img.height;let ctx=c.getContext('2d');ctx.drawImage(img,0,0);let data=ctx.getImageData(0,0,c.width,c.height);let code=jsQR(data.data,c.width,c.height);if(code&&code.data){basePayload=code.data.trim();localStorage.setItem('tama_qris',basePayload);statusEl.textContent="QRIS terbaca!";renderQR(basePayload);updateDisplay()}else statusEl.textContent="Gagal baca"};img.src=URL.createObjectURL(file)});
let saved=localStorage.getItem('tama_qris');if(saved){basePayload=saved;renderQR(basePayload);statusEl.textContent="QRIS tersimpan";updateDisplay()}
fetch('qris-tama-store.JPG').then(r=>r.blob()).then(b=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');c.width=img.width;c.height=img.height;let ctx=c.getContext('2d');ctx.drawImage(img,0,0);let d=ctx.getImageData(0,0,c.width,c.height);let code=jsQR(d.data,c.width,c.height);if(code&&code.data&&!localStorage.getItem('tama_qris')){basePayload=code.data.trim();localStorage.setItem('tama_qris',basePayload);renderQR(basePayload);statusEl.textContent="Auto-load dari qris-tama-store.JPG";updateDisplay()}};img.src=URL.createObjectURL(b)}).catch(()=>{});
</script>
</body>
</html>
