<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Tama Store V4 Draggable</title>
<style>
*{box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{margin:0;background:#0a0a0a;color:#fff;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding-bottom:200px}
.header{padding:18px 16px 8px;text-align:center;width:100%}
.card{width:92%;max-width:380px;background:#fff;border-radius:20px;padding:16px;margin-top:6px;display:flex;flex-direction:column;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.top{color:#111;font-weight:900}
.qr{width:300px;height:300px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:10px 0;border:2px dashed #ddd;overflow:hidden}
.badge{background:#e11d48;color:#fff;font-size:12px;padding:8px 14px;border-radius:20px;font-weight:800}
.amount{width:92%;max-width:380px;background:#151515;border:1px solid #222;border-radius:16px;padding:14px;margin:14px 0}
.sheet{position:fixed;left:0;right:0;background:#fff;color:#111;border-radius:24px 24px 0 0;padding:0 16px 20px;max-width:420px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.6);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:99;bottom:0}
.sheet.minimized{transform:translateY(calc(100% - 90px))}
.sheet-header{padding:12px 0 8px;text-align:center;cursor:pointer;touch-action:none}
.drag-handle{width:40px;height:5px;background:#ddd;border-radius:10px;margin:0 auto 10px}
.keypad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.key{height:52px;border:none;background:#f3f3f5;border-radius:12px;font-size:20px;font-weight:600;color:#111}
.btn{width:100%;height:52px;border:none;border-radius:12px;background:#e11d48;color:#fff;font-weight:800;margin-top:12px;font-size:14px}
.hidden{display:none}
#status{font-size:12px;text-align:center;padding:8px 12px;border-radius:10px;max-width:380px;margin:6px 0;font-weight:700}
#qrcodeDiv canvas{width:280px!important;height:280px!important}
.toggleHint{font-size:11px;opacity:.5;margin-top:4px}
.fullscreenQR{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.fullscreenQR.hidden{display:none!important}
</style>
</head>
<body>
<div class="header"><h1>MR.TAMA - Tama Store</h1><p style="opacity:.6;font-size:12px">NMID ID1025408255863</p></div>
<div class="card">
<div class="top">QRIS - TAMA STORE</div>
<div class="qr" id="qrWrap"><div id="qrcodeDiv"></div></div>
<div class="badge" id="badge">DINAMIS</div>
<p style="color:#111;font-size:11px;margin:8px 0 0;text-align:center;opacity:.6" id="amountDesc">Rp50.000 - Klik QR untuk fullscreen</p>
</div>
<div id="status" style="background:#22c55e;color:#fff">✅ QRIS DINAMIS SIAP</div>
<div class="amount"><div style="font-size:11px;opacity:.5">JUMLAH BAYAR SAAT INI</div><div style="font-size:32px;font-weight:800">Rp<span id="amountText">50.000</span></div></div>
<label for="fileInput" style="background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;cursor:pointer;display:block;font-size:12px;text-align:center;border:1px solid #333">📷 GANTI QRIS ASLI (jika perlu)</label>
<input type="file" id="fileInput" accept="image/*" style="display:none">
<div class="sheet" id="sheet">
<div class="sheet-header" id="sheetHeader">
<div class="drag-handle"></div>
<h3 style="margin:0">Atur Harga</h3>
<div class="toggleHint" id="toggleHint">▼ Tap untuk sembunyikan • ▲ Tap untuk munculkan</div>
</div>
<div style="border-bottom:1px solid #eee;padding-bottom:10px;margin-bottom:10px"><div style="font-size:12px;opacity:.5">Jumlah</div><div id="inputDisplay" style="font-size:28px;font-weight:800">Rp50.000</div></div>
<div class="keypad">
<button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
<button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
<button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
<button class="key" data-k="0">0</button><button class="key" data-k="000">000</button><button class="key" data-k="del">⌫</button>
</div>
<button class="btn" id="btnCreate">BUAT QRIS - Rp50.000</button>
<button class="btn hidden" id="btnReset" style="background:#fff;color:#111;border:1px solid #ddd">RESET KE STATIS</button>
</div>
<div class="fullscreenQR hidden" id="fsQR">
<div style="background:#fff;padding:20px;border-radius:20px;display:flex;flex-direction:column;align-items:center">
<div id="fsQRDiv"></div>
<div style="color:#111;font-weight:800;margin-top:12px" id="fsAmount">Rp50.000</div>
<div style="color:#666;font-size:12px">Scan untuk bayar</div>
</div>
<button onclick="document.getElementById('fsQR').classList.add('hidden')" style="margin-top:20px;background:#fff;color:#111;border:none;padding:12px 24px;border-radius:12px;font-weight:800">TUTUP</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
let basePayload=null,currentAmount="50000";
const amountText=document.getElementById('amountText'),inputDisplay=document.getElementById('inputDisplay'),btnCreate=document.getElementById('btnCreate'),btnReset=document.getElementById('btnReset'),badge=document.getElementById('badge'),statusEl=document.getElementById('status'),qrcodeDiv=document.getElementById('qrcodeDiv'),sheet=document.getElementById('sheet'),sheetHeader=document.getElementById('sheetHeader'),amountDesc=document.getElementById('amountDesc'),fsQR=document.getElementById('fsQR'),fsQRDiv=document.getElementById('fsQRDiv'),fsAmount=document.getElementById('fsAmount');
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++){if(c&0x8000)c=(c<<1)^0x1021;else c<<=1;c&=0xFFFF}}return c.toString(16).toUpperCase().padStart(4,'0')}
function makeDynamic(payload,amount){let noCrc=payload.split("6304")[0];if(noCrc.indexOf("010211")!==-1)noCrc=noCrc.replace("010211","010212");let cleaned="";let i=0;while(i+4<=noCrc.length){let tag=noCrc.substr(i,2);let len=parseInt(noCrc.substr(i+2,2),10);if(isNaN(len))break;let tot=4+len;if(tag==="54"){i+=tot;continue}cleaned+=noCrc.substr(i,tot);i+=tot}let insert=cleaned.indexOf("5802");if(insert===-1)insert=cleaned.length;let aStr=amount.toString();let aTag="54"+String(aStr.length).padStart(2,'0')+aStr;let withA=cleaned.slice(0,insert)+aTag+cleaned.slice(insert);let withCrc=withA+"6304";return withCrc+crc16(withCrc);}
function renderQR(text){if(!text)return;qrcodeDiv.innerHTML="";fsQRDiv.innerHTML="";new QRCode(qrcodeDiv,{text:text,width:280,height:280,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});new QRCode(fsQRDiv,{text:text,width:320,height:320,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});}
function updateDisplay(){let d=currentAmount?Number(currentAmount).toLocaleString('id-ID'):"0";amountText.textContent=d;inputDisplay.textContent="Rp"+d;btnCreate.textContent=currentAmount?"BUAT QRIS - Rp"+d:"BUAT QRIS";amountDesc.textContent="Rp"+d+" - Klik QR untuk fullscreen";fsAmount.textContent="Rp"+d;if(!currentAmount){statusEl.textContent="Ketik nominal";statusEl.style.background="#f59e0b";statusEl.style.color="#000";return}statusEl.textContent="✅ Siap: Rp"+d;statusEl.style.background="#22c55e";statusEl.style.color="#fff";}
document.querySelectorAll('.key').forEach(k=>{k.addEventListener('click',()=>{let v=k.dataset.k;if(v==='del')currentAmount=currentAmount.slice(0,-1);else{if(currentAmount.length>=12)return;if(currentAmount===""&&(v==="0"||v==="000"))return;currentAmount+=v}updateDisplay();})});
btnCreate.addEventListener('click',()=>{if(!basePayload){alert("Upload QRIS asli dulu");return}if(!currentAmount){alert("Ketik nominal dulu");return}let dyn=makeDynamic(basePayload,currentAmount);renderQR(dyn);badge.textContent="DINAMIS Rp"+Number(currentAmount).toLocaleString('id-ID');badge.style.background="#e11d48";btnReset.classList.remove('hidden');statusEl.textContent="✅ QRIS Rp"+Number(currentAmount).toLocaleString('id-ID')+" JADI!";statusEl.style.background="#e11d48";statusEl.style.color="#fff";sheet.classList.add('minimized');});
btnReset.addEventListener('click',()=>{renderQR(basePayload);badge.textContent="STATIS";badge.style.background="#111";btnReset.classList.add('hidden');});
sheetHeader.addEventListener('click',()=>{sheet.classList.toggle('minimized')});
document.getElementById('qrWrap').addEventListener('click',()=>{fsQR.classList.remove('hidden')});
document.getElementById('fileInput').addEventListener('change',e=>{let file=e.target.files[0];if(!file)return;let img=new Image();img.onload=()=>{let c=document.createElement('canvas');c.width=img.width;c.height=img.height;let ctx=c.getContext('2d');ctx.drawImage(img,0,0);let data=ctx.getImageData(0,0,c.width,c.height);let code=jsQR(data.data,c.width,c.height);if(code&&code.data){basePayload=code.data.trim();localStorage.setItem('tama_qris_v4',basePayload);renderQR(basePayload);statusEl.textContent="✅ QRIS BARU TERBACA";statusEl.style.background="#22c55e";updateDisplay();}else{statusEl.textContent="❌ Gagal baca";statusEl.style.background="#ef4444"}};img.src=URL.createObjectURL(file)});
let saved=localStorage.getItem('tama_qris_v4')||localStorage.getItem('tama_qris_v3')||localStorage.getItem('tama_qris_v2')||localStorage.getItem('tama_qris');if(saved){basePayload=saved;let dyn=makeDynamic(basePayload,currentAmount);renderQR(dyn);badge.textContent="DINAMIS Rp"+Number(currentAmount).toLocaleString('id-ID');badge.style.background="#e11d48";btnReset.classList.remove('hidden');updateDisplay();setTimeout(()=>{sheet.classList.add('minimized')},1000)}
fetch('qris-tama-store.JPG').then(r=>r.blob()).then(b=>{if(!b||b.size<500)return;let img=new Image();img.onload=()=>{let c=document.createElement('canvas');c.width=img.width;c.height=img.height;let ctx=c.getContext('2d');ctx.drawImage(img,0,0);let d=ctx.getImageData(0,0,c.width,c.height);let code=jsQR(d.data,c.width,c.height);if(code&&code.data&&!localStorage.getItem('tama_qris_v4')){basePayload=code.data.trim();localStorage.setItem('tama_qris_v4',basePayload);let dyn=makeDynamic(basePayload,currentAmount);renderQR(dyn);badge.textContent="DINAMIS Rp"+Number(currentAmount).toLocaleString('id-ID');badge.style.background="#e11d48";updateDisplay()}};img.src=URL.createObjectURL(b)}).catch(()=>{});
</script>
</body>
</html>
